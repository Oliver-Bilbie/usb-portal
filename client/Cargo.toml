[package]
name = "usb-portal-client"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.16.1"
axum = "0.8"
futures = "0.3.34"
ksni = "0.3.6"
log = "0.4.34"
reqwest = "0.13.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7.19"
usb-portal-lib = { path = "../lib" }
uuid = { version = "1.26.1", features = ["v4"] }
